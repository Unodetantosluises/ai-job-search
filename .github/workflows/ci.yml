name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Guardián 1: Compilación TypeScript & Arquitectura NestJS
  # -------------------------------------------------------------
  build:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación NestJS
        run: npm run build

  # -------------------------------------------------------------
  # Guardián 2: Protección de Privacidad y PII
  # -------------------------------------------------------------
  privacy-guard:
    name: Privacy & PII Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar que no existan datos sensibles rastreados
        run: node tools/check-privacy.js

  # -------------------------------------------------------------
  # Guardián 3: Validación del Modelo Google Gemini
  # -------------------------------------------------------------
  gemini-validation:
    name: Gemini Model & API Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar modelo y vigencia en la API de Google
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: node tools/verify-gemini.js

  # -------------------------------------------------------------
  # Guardián 4: Smoke Test de Compilación Docker (TeX Live / LaTeX)
  # -------------------------------------------------------------
  docker-smoke-test:
    name: Docker LaTeX Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de compilación LaTeX
        run: docker build -t ai-job-search-latex .
